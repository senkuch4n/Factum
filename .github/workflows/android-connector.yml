# Factum Connector — compila, chequea y (solo en un tag desde main) firma y publica el APK auxiliar del
# registro de llamadas (SDD extraccion-logica-android §7.3).
#
# Modos:
#   - PR / push a develop|main que toca android/connector/**: arma lintRelease + assembleRelease SIN firmar,
#     valida el wrapper y chequea que el único permiso sea READ_CALL_LOG y que no haya activity launcher.
#     No usa secrets (sirve para forks).
#   - push de un tag connector-vX.Y.Z (solo desde un commit que está en main, patrón P3) o workflow_dispatch
#     con publicar=true desde main: firma con la clave del environment android-connector, verifica que el
#     SHA-256 del certificado coincida con la variable ANDROID_CONNECTOR_CERT_SHA256, y publica el GitHub
#     Release con el APK, su .sha256 y build-info.txt. El job summary imprime el JSON para connector-lock.json.
#
# Los valores de inputs/vars/secrets llegan a los run: por env:, nunca interpolados en el script.
# La clave de firma la custodia el dueño del producto (U1): el repo solo guarda los secrets del environment.
name: Android connector

on:
  pull_request:
    branches: [develop, main]
    paths:
      - android/connector/**
      - .github/workflows/android-connector.yml
  push:
    branches: [develop, main]
    paths:
      - android/connector/**
      - .github/workflows/android-connector.yml
    tags: ["connector-v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar la release (solo desde main). Sin tildar = ensayo."
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('connector-pr-{0}', github.event.number) || 'connector-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build y chequeos (sin firmar)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android/connector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validar el wrapper de Gradle
        uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: lintRelease + assembleRelease (sin firmar)
        run: ./gradlew :app:lintRelease :app:assembleRelease --no-daemon

      - name: Chequear permisos y que no haya launcher
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [[ -n "$APK" ]] || { echo "::error::no se encontró el APK de release"; exit 1; }
          echo "APK: $APK"
          AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)
          [[ -n "$AAPT2" ]] || { echo "::error::no se encontró aapt2"; exit 1; }
          DUMP=$("$AAPT2" dump badging "$APK")
          PERMS=$(echo "$DUMP" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort -u)
          echo "Permisos declarados:"; echo "$PERMS"
          if [[ "$PERMS" != "android.permission.READ_CALL_LOG" ]]; then
            echo "::error::permisos inesperados. Se esperaba solo READ_CALL_LOG."
            exit 1
          fi
          if echo "$DUMP" | grep -q "launchable-activity"; then
            echo "::error::el connector no debe tener activity launcher."
            exit 1
          fi
          echo "OK: solo READ_CALL_LOG y sin launcher."

  release:
    name: Firmar y publicar (tag connector-v*)
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/connector-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publicar)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: android-connector
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android/connector
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: P3 — el commit tiene que estar en main
        run: |
          set -euo pipefail
          git fetch origin main --depth=50 >/dev/null 2>&1 || true
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El commit ${GITHUB_SHA:0:12} no está en main: el connector solo se publica desde main (P3)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validar el wrapper de Gradle
        uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Versión desde el tag
        id: ver
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/connector-v* ]]; then
            V="${REF#refs/tags/connector-v}"
          else
            V="1.0.0"
          fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versión inválida '$V'"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Decodificar el keystore
        env:
          KS_B64: ${{ secrets.ANDROID_CONNECTOR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/factum-connector.jks"

      - name: assembleRelease (firmado)
        env:
          CONNECTOR_KEYSTORE: ${{ runner.temp }}/factum-connector.jks
          CONNECTOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CONNECTOR_KEYSTORE_PASSWORD }}
          CONNECTOR_KEY_ALIAS: ${{ secrets.ANDROID_CONNECTOR_KEY_ALIAS }}
          CONNECTOR_KEY_PASSWORD: ${{ secrets.ANDROID_CONNECTOR_KEY_PASSWORD }}
          CV: ${{ steps.ver.outputs.version }}
        run: ./gradlew :app:assembleRelease -PconnectorVersionName="$CV" -PconnectorVersionCode=1 --no-daemon

      - name: Verificar firma, certificado y permisos
        id: verify
        env:
          CV: ${{ steps.ver.outputs.version }}
          CERT_EXPECTED: ${{ vars.ANDROID_CONNECTOR_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          [[ -n "$APK" ]] || { echo "::error::no se encontró el APK firmado"; exit 1; }
          BT=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort | tail -1)
          APKSIGNER="$BT/apksigner"; AAPT2="$BT/aapt2"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f' | tr -d ' ')
          echo "cert_sha256=$CERT"
          if [[ -z "$CERT_EXPECTED" ]]; then
            echo "::error::falta la variable ANDROID_CONNECTOR_CERT_SHA256"; exit 1
          fi
          if [[ "$CERT" != "$CERT_EXPECTED" ]]; then
            echo "::error::el certificado ($CERT) no coincide con ANDROID_CONNECTOR_CERT_SHA256 ($CERT_EXPECTED). ¿Cambió la clave?"
            exit 1
          fi
          PERMS=$("$AAPT2" dump badging "$APK" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort -u)
          [[ "$PERMS" == "android.permission.READ_CALL_LOG" ]] || { echo "::error::permisos inesperados: $PERMS"; exit 1; }
          "$AAPT2" dump badging "$APK" | grep -q launchable-activity && { echo "::error::no debe haber launcher"; exit 1; } || true
          DEST="$RUNNER_TEMP/factum-connector-$CV.apk"
          cp "$APK" "$DEST"
          SHA=$(sha256sum "$DEST" | cut -d' ' -f1)
          echo "$SHA  factum-connector-$CV.apk" > "$DEST.sha256"
          {
            echo "commit: $GITHUB_SHA"
            echo "version: $CV"
            echo "apk_sha256: $SHA"
            echo "cert_sha256: $CERT"
            echo "gradle: 8.13"
            echo "agp: 8.9.1"
            echo "kotlin: 2.1.20"
            echo "jdk: 17"
          } > "$RUNNER_TEMP/build-info.txt"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"

      - name: Borrar el keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/factum-connector.jks"

      - name: Publicar la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CV: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "connector-v$CV" \
            "$RUNNER_TEMP/factum-connector-$CV.apk" \
            "$RUNNER_TEMP/factum-connector-$CV.apk.sha256" \
            "$RUNNER_TEMP/build-info.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Factum Connector v$CV" \
            --notes "App auxiliar del registro de llamadas. Verificá el SHA-256 y actualizá android/connector/connector-lock.json en un PR."

      - name: JSON para connector-lock.json
        env:
          CV: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.verify.outputs.sha }}
          CERT: ${{ steps.verify.outputs.cert }}
        run: |
          {
            echo '### connector-lock.json'
            echo '```json'
            echo "{"
            echo "  \"package\": \"app.factum.connector\","
            echo "  \"version_name\": \"$CV\","
            echo "  \"version_code\": 1,"
            echo "  \"sha256\": \"$SHA\","
            echo "  \"cert_sha256\": \"$CERT\","
            echo "  \"release_tag\": \"connector-v$CV\","
            echo "  \"asset\": \"factum-connector-$CV.apk\""
            echo "}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
