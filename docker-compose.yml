services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server/src/Factum.Backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - MongoDb__DatabaseName=factum
      - Jwt__Secret=factum-dev-secret-change-in-production
      - Jwt__ExpiryHours=8
      - Auth__Mode=dev
      # Login real contra un proveedor HTTP externo (ver README, "Autenticación"):
      # - Auth__Mode=external
      # - Auth__External__BaseUrl=https://<proveedor>
      # Integración opcional de soporte (Faro), apagada por defecto:
      # - Integrations__Support__Enabled=true
      # - Integrations__Support__BaseUrl=https://<backend-de-faro>
      # - Integrations__Support__ServiceKey=<clave>
      # - Integrations__Support__FrontendUrl=https://<frontend-de-faro>
      - Storage__DataDirectory=/data
    volumes:
      - backend-data:/data
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
      - NEXT_PUBLIC_AGENT_URL=http://localhost:8765
    depends_on:
      - backend
    restart: unless-stopped

# El agente NO está en docker-compose porque corre localmente
# en la PC del fiscal (necesita acceso USB al dispositivo móvil).

volumes:
  backend-data:
  mongo-data:
